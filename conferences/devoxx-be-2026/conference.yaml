name: Devoxx Belgium 2026
slug: devoxx-be-2026

# Who the talks are for: a verdict's Reach and the ranking (scripts/rank.py) are judged against this.
audience: >-
  Mostly Java and JVM developers, tech leads and architects building and running business applications:
  backend services on Spring Boot, Quarkus or Jakarta EE, relational databases and messaging, deployed to
  containers, Kubernetes and the public cloud. Many use AI coding assistants daily and are adding LLM features
  to their applications; few work on GPU computing, compilers, JVM internals or embedded systems.

talks:
  source: devoxx-cfp   # adapter in scripts/catalog.py (cfp.dev API, shared by Devoxx/VoxxedDays)
  baseUrl: https://dvbe26.cfp.dev/api/public

videos:
  playlists:
    - https://www.youtube.com/playlist?list=PLKlmOVksNGoE   # "Devoxx Belgium 2026" on @DevoxxForever
  # Stripped (case-insensitive) from video titles before matching: the last " by <speakers>".
  titleSuffix: '\s+by\s+(?:(?!\s+by\s).)*$'
  captionLang: en-orig

matching:
  accept: 0.85   # >= accept -> matched
  review: 0.60   # >= review -> needs-review; below -> no-video

excludeSessionTypes: [BOF, Hands-on Lab, Keynote Overflow]

# talkId: videoId (force a match) | null (no video exists). Wins over the matcher on every rebuild.
overrides: {31451: aup9tNzQu7c, 9023: eSSPOCeoF0c, 25652: _dcauZC9ST8, 52104: jhvT8hVYSvQ}
